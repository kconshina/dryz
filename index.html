<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Иван — визитка</title>
<style>
  :root {
    --bg: #050505;
    --line: rgba(255, 255, 255, 0.12);
    --text: #f4f4f4;
    --muted: #9a9a9a;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 18px;
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(900px 500px at 10% -10%, #1d1d1d 0%, transparent 60%),
      radial-gradient(800px 480px at 100% 110%, #121212 0%, transparent 60%),
      var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { width: 100%; max-width: 720px; margin: 0 auto; }

  .card {
    padding: 30px;
    border: 1px solid var(--line);
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(24, 24, 24, 0.9), rgba(8, 8, 8, 0.94));
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
  }

  .profile { display: flex; align-items: center; gap: 16px; }
  .avatar {
    flex: none;
    width: 68px; height: 68px;
    display: block;
    object-fit: cover;
    object-position: center;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: #111;
  }
  h1 { margin: 0; font-size: clamp(26px, 6vw, 34px); line-height: 1.1; letter-spacing: -0.03em; }
  .profile > div { min-width: 0; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    width: 100%;
    min-height: 46px;
    margin-top: 26px;
    padding: 12px 20px;
    border-radius: 12px;
    color: #050505;
    font: inherit;
    font-size: 13.5px;
    font-weight: 650;
    text-decoration: none;
    background: linear-gradient(135deg, #ffffff, #c7c7c7);
    transition: filter .15s, transform .15s;
  }
  .btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .btn svg { flex: none; }

  .download-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 12px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
  }
  .download-link:hover { background: rgba(255, 255, 255, 0.05); }
  .download-link span:last-child { color: var(--muted); font-weight: 400; }

  footer {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 12px;
    justify-content: space-between;
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 11.5px;
    color: var(--muted);
  }
  footer a { color: var(--text); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @media (max-width: 560px) {
    body { padding: 14px 12px; align-items: flex-start; }
    .card { padding: 24px 18px; border-radius: 18px; }
    .avatar { width: 58px; height: 58px; border-radius: 17px; }
    footer { justify-content: center; text-align: center; }
  }
</style>
<link rel="stylesheet" href="hearts.css">
</head>
