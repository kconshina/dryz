<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Иван — визитка</title>
<style>
  :root {
    --bg: #050505;
    --line: rgba(255, 255, 255, 0.12);
    --text: #f4f4f4;
    --muted: #9a9a9a;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 18px;
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(900px 500px at 10% -10%, #1d1d1d 0%, transparent 60%),
      radial-gradient(800px 480px at 100% 110%, #121212 0%, transparent 60%),
      var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { width: 100%; max-width: 720px; margin: 0 auto; }

  .card {
    position: relative;
    z-index: 1;
    padding: 30px;
    border: 1px solid var(--line);
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(24, 24, 24, 0.9), rgba(8, 8, 8, 0.94));
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
  }

  .profile { display: flex; align-items: center; gap: 16px; }
  .avatar {
    flex: none;
    width: 68px; height: 68px;
    display: block;
    object-fit: cover;
    object-position: center;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: #111;
  }
  h1 { margin: 0; font-size: clamp(26px, 6vw, 34px); line-height: 1.1; letter-spacing: -0.03em; }
  .profile > div { min-width: 0; }
  .thanks {
    width: fit-content;
    margin: 7px 0 0;
    color: var(--muted);
    font-size: 12.5px;
    line-height: 1.45;
    cursor: pointer;
    user-select: none;
    transition: color .15s, transform .15s;
  }
  .thanks:hover { color: var(--text); }
  .thanks.pop { color: var(--text); transform: scale(1.04); }
  .thanks:focus-visible { outline: 1px solid var(--line); outline-offset: 4px; border-radius: 4px; }

  /* Сердечки на фоне */
  .hearts {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .heart {
    position: absolute;
    color: #fff;
    line-height: 1;
    user-select: none;
    animation: heart-float var(--dur, 2.4s) ease-out forwards;
    will-change: transform, opacity;
  }
  @keyframes heart-float {
    0%   { opacity: 0; transform: translate3d(0, 0, 0) rotate(var(--rot, 0deg)); }
    15%  { opacity: var(--alpha, .5); }
    55%  { opacity: var(--alpha, .5); }
    100% { opacity: 0; transform: translate3d(var(--dx, 0px), var(--dy, -100px), 0) rotate(var(--rot, 0deg)); }
  }
  /* Если в системе включено «уменьшить движение», сердечки не летят, а просто гаснут */
  .heart.still { animation-name: heart-still; }
  @keyframes heart-still {
    0%   { opacity: 0; }
    15%  { opacity: var(--alpha, .5); }
    55%  { opacity: var(--alpha, .5); }
    100% { opacity: 0; }
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    width: 100%;
    min-height: 46px;
    margin-top: 26px;
    padding: 12px 20px;
    border-radius: 12px;
    color: #050505;
    font: inherit;
    font-size: 13.5px;
    font-weight: 650;
    text-decoration: none;
    background: linear-gradient(135deg, #ffffff, #c7c7c7);
    transition: filter .15s, transform .15s;
  }
  .btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .btn svg { flex: none; }

  .download-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 12px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
  }
  .download-link:hover { background: rgba(255, 255, 255, 0.05); }
  .download-link span:last-child { color: var(--muted); font-weight: 400; }

  footer {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 12px;
    justify-content: space-between;
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 11.5px;
    color: var(--muted);
  }
  footer a { color: var(--text); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @media (max-width: 560px) {
    body { padding: 14px 12px; align-items: flex-start; }
    .card { padding: 24px 18px; border-radius: 18px; }
    .avatar { width: 58px; height: 58px; border-radius: 17px; }
    footer { justify-content: center; text-align: center; }
  }
</style>
</head>
<body>
<div class="hearts" id="hearts" aria-hidden="true"></div>
<div class="wrap">

  <main class="card">
    <!-- ЗАМЕНИТЕ: имя и ссылку https://t.me/kconshina при необходимости -->
    <header class="profile">
      <img class="avatar" src="avatar.jpg" alt="Иван">
      <div>
        <h1>Иван</h1>
        <p class="thanks" id="thanks" role="button" tabindex="0" title="Нажми — появятся сердечки">Спасибо Леве, Даше, Саше и Сони ♥</p>
      </div>
    </header>

    <a class="btn" href="https://t.me/kconshina" target="_blank" rel="noopener">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M21.6 3.4 2.9 10.6c-1 .4-1 1.8.1 2.1l4.7 1.4 1.8 5.6c.3.9 1.4 1.1 2 .4l2.5-2.6 4.8 3.5c.8.6 1.9.1 2.1-.8l3-14.6c.2-1.1-.9-1.9-1.9-1.5Zm-3.2 3.2-8.8 7.9c-.3.3-.5.7-.5 1.1l-.3 2.6-1.2-3.8 9.4-8.2c.5-.4 1.2.2.8.7l-.4.5Z"/>
      </svg>
      Telegram · @kconshina
    </a>

    <a class="download-link" href="download.html">
      <span>Скачать конфиги AmneziaWG</span>
      <span>→</span>
    </a>

    <a class="download-link" href="ip.html">
      <span>Проверить IP и скорость интернета</span>
      <span>→</span>
    </a>

    <footer>
      <span>© 2026 Иван</span>
      <span><a href="guide.html">Гайд</a> · <a href="warp.html">WARP</a></span>
    </footer>
  </main>

</div>

<script>
(function () {
  'use strict';
  var hearts = document.getElementById('hearts');
  var thanks = document.getElementById('thanks');
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function spawnHearts() {
    thanks.classList.add('pop');
    setTimeout(function () { thanks.classList.remove('pop'); }, 220);

    for (var i = 0; i < 18; i++) {
      var heart = document.createElement('span');
      heart.className = reduceMotion ? 'heart still' : 'heart';
      heart.textContent = Math.random() < 0.25 ? '♡' : '♥';
      heart.style.fontSize = (13 + Math.random() * 25).toFixed(0) + 'px';
      heart.style.left = (4 + Math.random() * 92).toFixed(1) + '%';
      heart.style.top = (12 + Math.random() * 83).toFixed(1) + '%';
      heart.style.setProperty('--dx', ((Math.random() - 0.5) * 100).toFixed(0) + 'px');
      heart.style.setProperty('--dy', '-' + (60 + Math.random() * 130).toFixed(0) + 'px');
      heart.style.setProperty('--rot', ((Math.random() - 0.5) * 60).toFixed(0) + 'deg');
      heart.style.setProperty('--dur', (3.2 + Math.random() * 2.4).toFixed(2) + 's');
      heart.style.setProperty('--alpha', (0.35 + Math.random() * 0.45).toFixed(2));
      hearts.appendChild(heart);
      heart.addEventListener('animationend', function () { this.remove(); });
    }
  }

  thanks.addEventListener('click', spawnHearts);
  thanks.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      spawnHearts();
    }
  });
})();
</script>
</body>
</html>
