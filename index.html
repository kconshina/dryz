<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Иван — личная страница</title>
<style>
  :root {
    --bg: #070b14;
    --line: rgba(148, 163, 184, 0.16);
    --text: #e6edf7;
    --muted: #93a4bd;
    --accent: #38bdf8;
    --accent-2: #22d3ee;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    place-items: center;
    padding: 24px;
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(1100px 600px at 12% -10%, #14305c 0%, transparent 60%),
      radial-gradient(900px 520px at 108% 112%, #0d3b3b 0%, transparent 58%),
      var(--bg);
  }
  .card {
    width: 100%;
    max-width: 680px;
    padding: 30px;
    border: 1px solid var(--line);
    border-radius: 24px;
    background: linear-gradient(180deg, rgba(22, 32, 56, 0.92), rgba(12, 18, 33, 0.95));
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(14px);
    animation: rise .45s ease both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .tabs {
    display: flex;
    gap: 4px;
    width: fit-content;
    margin-bottom: 26px;
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: rgba(8, 13, 25, 0.35);
  }
  .tabs a {
    padding: 8px 14px;
    border-radius: 9px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    transition: color .15s, background .15s;
  }
  .tabs a:hover:not(.active) { color: var(--text); background: rgba(148, 163, 184, 0.08); }
  .tabs a.active {
    color: #04121f;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }

  .profile { display: flex; align-items: center; gap: 18px; }
  .avatar {
    flex: none;
    width: 76px; height: 76px;
    display: grid; place-items: center;
    border-radius: 22px;
    font-size: 34px;
    font-weight: 800;
    color: #06121f;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 12px 34px rgba(34, 211, 238, 0.28);
  }
  h1 {
    margin: 0 0 5px;
    font-size: clamp(26px, 5vw, 34px);
    line-height: 1.1;
    letter-spacing: -0.03em;
  }
  .role { margin: 0; color: var(--accent); font-size: 13px; font-weight: 600; letter-spacing: .02em; }
  .about {
    margin: 24px 0 0;
    color: #c7d3e3;
    font-size: 15px;
    line-height: 1.65;
  }
  .actions { margin-top: 22px; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border-radius: 12px;
    padding: 14px 22px;
    font: inherit;
    font-size: 14px;
    font-weight: 650;
    text-decoration: none;
    transition: filter .15s, transform .15s;
  }
  .btn.primary {
    color: #04121f;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 8px 24px rgba(34, 211, 238, 0.24);
  }
  .btn.primary:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .btn svg { flex: none; }

  .download-card {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 26px;
    padding: 16px;
    border: 1px solid rgba(56, 189, 248, 0.22);
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.12), rgba(34, 211, 238, 0.05));
    color: inherit;
    text-decoration: none;
    transition: border-color .15s, transform .15s, background .15s;
  }
  .download-card:hover {
    border-color: rgba(56, 189, 248, 0.45);
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(34, 211, 238, 0.07));
    transform: translateY(-1px);
  }
  .download-icon {
    flex: none;
    width: 48px; height: 48px;
    display: grid; place-items: center;
    border-radius: 13px;
    color: #04121f;
    font-size: 24px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  .download-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .download-text b { font-size: 14px; line-height: 1.3; }
  .download-text span { font-size: 12px; color: var(--muted); }
  .download-arrow { flex: none; color: var(--accent); font-size: 20px; }

  footer {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    align-items: center;
    justify-content: space-between;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 12.5px;
    color: var(--muted);
  }

  @media (max-width: 560px) {
    body { padding: 12px; align-items: start; }
    .card { padding: 22px 18px; border-radius: 20px; margin: 8px 0; }
    .tabs { width: 100%; }
    .tabs a { flex: 1; text-align: center; }
    .profile { gap: 14px; }
    .avatar { width: 62px; height: 62px; font-size: 27px; border-radius: 18px; }
    .about { margin-top: 20px; font-size: 14px; }
    .btn { width: 100%; }
    .download-card { padding: 14px; gap: 11px; }
    .download-icon { width: 42px; height: 42px; font-size: 21px; border-radius: 11px; }
    footer { justify-content: center; text-align: center; }
  }
</style>
</head>
<body>
<main class="card">
  <!-- ЗАМЕНИТЕ: имя, описание, @username и ссылку https://t.me/username -->
  <nav class="tabs" aria-label="Разделы сайта">
    <a href="index.html" class="active" aria-current="page">Визитка</a>
    <a href="download.html">Скачать</a>
  </nav>

  <header class="profile">
    <div class="avatar" aria-hidden="true">И</div>
    <div>
      <h1>Иван</h1>
      <p class="role">AmneziaWG · VPN · сети</p>
    </div>
  </header>

  <p class="about">
    Настраиваю AmneziaWG и помогаю с VPN. Ниже — готовые конфиги для подключения
    и клиенты для всех платформ.
  </p>

  <div class="actions">
    <a class="btn primary" href="https://t.me/username" target="_blank" rel="noopener">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M21.6 3.4 2.9 10.6c-1 .4-1 1.8.1 2.1l4.7 1.4 1.8 5.6c.3.9 1.4 1.1 2 .4l2.5-2.6 4.8 3.5c.8.6 1.9.1 2.1-.8l3-14.6c.2-1.1-.9-1.9-1.9-1.5Zm-3.2 3.2-8.8 7.9c-.3.3-.5.7-.5 1.1l-.3 2.6-1.2-3.8 9.4-8.2c.5-.4 1.2.2.8.7l-.4.5Z"/>
      </svg>
      Telegram · @kconshina
    </a>
  </div>

  <a class="download-card" href="download.html">
    <span class="download-icon" aria-hidden="true">↓</span>
    <span class="download-text">
      <b>Скачать конфиги AmneziaWG</b>
      <span>Все конфиги · ZIP-архив</span>
    </span>
    <span class="download-arrow" aria-hidden="true">→</span>
  </a>

  <footer>
    <span>© 2026 Иван</span>
    <span>Личная страница</span>
  </footer>
</main>
</body>
</html>
